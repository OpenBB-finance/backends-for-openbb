<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16213E"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg)" rx="12"/>
  <!-- Databricks brick mark -->
  <g fill="#FF3621">
    <rect x="24" y="22" width="14" height="8" rx="1" opacity="0.9"/>
    <rect x="24" y="33" width="20" height="8" rx="1" opacity="0.75"/>
    <rect x="24" y="44" width="26" height="8" rx="1" opacity="0.6"/>
  </g>
  <!-- Taxi line chart motif -->
  <polyline points="180,105 202,80 222,95 244,60 268,72" fill="none" stroke="#FADB14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="180" cy="105" r="4" fill="#FADB14"/>
  <circle cx="244" cy="60" r="4" fill="#FADB14"/>
  <!-- Checker strip -->
  <g opacity="0.85">
    <rect x="180" y="122" width="11" height="11" fill="#FADB14"/>
    <rect x="202" y="122" width="11" height="11" fill="#FADB14"/>
    <rect x="224" y="122" width="11" height="11" fill="#FADB14"/>
    <rect x="246" y="122" width="11" height="11" fill="#FADB14"/>
    <rect x="191" y="133" width="11" height="11" fill="#FADB14"/>
    <rect x="213" y="133" width="11" height="11" fill="#FADB14"/>
    <rect x="235" y="133" width="11" height="11" fill="#FADB14"/>
    <rect x="257" y="133" width="11" height="11" fill="#FADB14"/>
  </g>
  <text x="24" y="158" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">NYC Taxi</text>
  <text x="24" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8B93A7">samples.nyctaxi</text>
</svg>
